<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Segmiq — Team Inbox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root{
    --bg-primary:#000000;
    --bg-tertiary:#0a0a0a;
    --bg-quaternary:#131313;
    --text-primary:#ededed;
    --text-secondary:rgba(237,237,237,0.62);
    --text-tertiary:rgba(237,237,237,0.4);
    --text-disabled:rgba(237,237,237,0.22);
    --surface-card:#111111;
    --border:rgba(255,255,255,0.07);
    --border-hover:rgba(255,255,255,0.15);
    --accent:#D4FF4F;
    --accent-foreground:#000000;
    --accent-hover:#c8f040;
    --success:#3dd68c;
    --error:#ff4444;
    --warning:#f5a623;
    --font-serif:'Instrument Serif', Georgia, serif;
    --font-sans:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:var(--bg-primary);
    color:var(--text-primary);
    font-family:var(--font-sans);
    margin:0;
    overflow:hidden;
  }
  ::-webkit-scrollbar{width:6px;height:6px;}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.12);border-radius:999px;}
  ::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.2);}
  .serif{font-family:var(--font-serif);}
  .icon{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
  .icon-sm{width:14px;height:14px;}
  .rail-btn{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--text-tertiary);cursor:pointer;transition:all .15s;}
  .rail-btn:hover{background:var(--bg-quaternary);color:var(--text-secondary);}
  .rail-btn.active{background:var(--surface-card);color:var(--accent);border:1px solid var(--border);}
  .conv-row{cursor:pointer;transition:background .12s;border-left:2px solid transparent;}
  .conv-row:hover{background:var(--bg-quaternary);}
  .conv-row.active{background:var(--bg-quaternary);border-left:2px solid var(--accent);}
  .filter-tab{cursor:pointer;color:var(--text-tertiary);transition:all .15s;}
  .filter-tab.active{color:var(--accent-foreground);background:var(--accent);}
  .filter-tab:not(.active):hover{color:var(--text-primary);}
  .bubble-in{background:var(--surface-card);border:1px solid var(--border);border-radius:14px 14px 14px 3px;}
  .bubble-out{background:rgba(212,255,79,0.1);border:1px solid rgba(212,255,79,0.25);border-radius:14px 14px 3px 14px;}
  .qr-chip{cursor:pointer;transition:all .15s;}
  .qr-chip:hover{border-color:var(--accent);color:var(--accent);}
  .score-bar-fill{transition:width .5s ease;}
  .pulse-dot{animation:pulse 1.6s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
  textarea:focus, input:focus{outline:none;}
  .fade-in{animation:fadeIn .18s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(3px);}to{opacity:1;transform:translateY(0);}}

  /* ---- Responsive collapse: keep the chat column usable at any width ---- */
  .toggle-btn{display:none;}
  #backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:35;}
  #backdrop.open{display:block;}

  @media (max-width:1180px){
    #intelPanel{
      position:fixed;top:64px;right:0;bottom:0;width:340px;
      transform:translateX(100%);transition:transform .22s ease;z-index:40;
      box-shadow:-12px 0 30px rgba(0,0,0,0.6);
    }
    #intelPanel.open{transform:translateX(0);}
    .toggle-intel{display:flex;}
  }
  @media (max-width:860px){
    #convPanel{
      position:fixed;top:64px;left:0;bottom:0;width:300px;
      transform:translateX(-100%);transition:transform .22s ease;z-index:40;
      box-shadow:12px 0 30px rgba(0,0,0,0.6);
    }
    #convPanel.open{transform:translateX(0);}
    .toggle-conv{display:flex;}
  }
  @media (max-width:640px){
    header .hidden.sm\:block{display:none;}
  }
</style>
</head>
<body>

const STAGE_STYLE = {
  "New Lead":      {bg:"rgba(212,255,79,0.12)", text:"var(--accent)", border:"rgba(212,255,79,0.3)"},
  "Contacted":     {bg:"rgba(255,255,255,0.06)", text:"var(--text-secondary)", border:"var(--border)"},
  "Quoted":        {bg:"rgba(245,166,35,0.12)", text:"var(--warning)", border:"rgba(245,166,35,0.3)"},
  "Follow-up Due": {bg:"rgba(245,166,35,0.12)", text:"var(--warning)", border:"rgba(245,166,35,0.3)"},
  "Won":           {bg:"rgba(61,214,140,0.12)", text:"var(--success)", border:"rgba(61,214,140,0.3)"},
  "Lost":          {bg:"rgba(255,68,68,0.12)", text:"var(--error)", border:"rgba(255,68,68,0.3)"}
};

let activeId = 1;
let activeFilter = "all";
let searchTerm = "";

function scoreColor(score){
  if(score>=70) return "var(--accent)";
  if(score>=45) return "var(--warning)";
  return "var(--text-tertiary)";
}
function scoreLabel(score){
  if(score>=70) return "Hot";
  if(score>=45) return "Warm";
  return "Cold";
}
function initials(name){
  return name.split(" ").map(n=>n[0]).join("").slice(0,2).toUpperCase();
}
function avatarColor(name){
  if(name===CURRENT_REP) return "var(--accent)";
  const palette = ["#5FD3A3","#F5A623","#7C9FFF","#FF8FB3","#4FD4E8"];
  let hash=0; for(const c of name) hash=(hash*31+c.charCodeAt(0))>>>0;
  return palette[hash%palette.length];
}
function claimLead(id, evt){
  evt.stopPropagation();
  const l = LEADS.find(x=>x.id===id);
  l.assigned = CURRENT_REP;
  renderList();
  if(id===activeId) renderIntel();
}

function filteredLeads(){
  return LEADS.filter(l=>{
    if(activeFilter==="unassigned" && l.assigned) return false;
    if(activeFilter==="mine" && l.assigned!==CURRENT_REP) return false;
    if(activeFilter==="hot" && l.score<70) return false;
    if(searchTerm && !(l.name.toLowerCase().includes(searchTerm) || l.location.toLowerCase().includes(searchTerm) || l.phone.includes(searchTerm))) return false;
    return true;
  }).sort((a,b)=>b.score-a.score);
}

function renderList(){
  const list = filteredLeads();
  document.getElementById("convList").innerHTML = list.map(l=>{
    const st = STAGE_STYLE[l.stage];
    return `
    <div class="conv-row px-4 py-3 border-b border-[var(--border)] ${l.id===activeId?'active':''}" onclick="selectLead(${l.id})">
      <div class="flex items-start gap-3">
        <div class="relative shrink-0">
          <div class="w-10 h-10 rounded-full flex items-center justify-center text-xs font-semibold" style="background:var(--bg-quaternary);color:var(--text-secondary)">${initials(l.name)}</div>
          ${l.assigned
            ? `<div class="absolute -bottom-1 -right-1 w-[18px] h-[18px] rounded-full flex items-center justify-center text-[9px] font-bold" style="background:${avatarColor(l.assigned)};color:#000;border:2px solid var(--bg-tertiary)" title="Assigned to ${l.assigned}">${initials(l.assigned)}</div>`
            : `<div class="absolute -bottom-1 -right-1 w-[18px] h-[18px] rounded-full flex items-center justify-center cursor-pointer" style="background:var(--bg-tertiary);border:1.5px dashed var(--text-tertiary)" title="Unassigned — tap to claim" onclick="claimLead(${l.id}, event)">
                <svg class="icon" style="width:10px;height:10px;color:var(--text-tertiary)" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
              </div>`
          }
        </div>
        <div class="flex-1 min-w-0">
          <div class="flex items-center justify-between gap-2">
            <span class="text-sm font-medium truncate" style="color:var(--text-primary)">${l.name}</span>
            <span class="text-[11px] shrink-0" style="color:var(--text-tertiary)">${l.lastTime}</span>
          </div>
          <div class="text-xs truncate mt-0.5" style="color:var(--text-tertiary)">${l.lastMessage}</div>
          <div class="flex items-center gap-1.5 mt-2 flex-wrap">
            <span class="text-[10px] font-semibold px-1.5 py-0.5 rounded serif" style="background:transparent;border:1px solid ${scoreColor(l.score)};color:${scoreColor(l.score)}">${l.score}</span>
            <span class="text-[10px] font-medium px-1.5 py-0.5 rounded" style="background:${st.bg};color:${st.text};border:1px solid ${st.border}">${l.stage}</span>
            <span class="text-[10px] px-1.5 py-0.5 rounded" style="background:var(--bg-quaternary);color:var(--text-tertiary)">${l.source}</span>
            ${l.unread>0?`<span class="text-[10px] font-semibold w-4 h-4 rounded-full flex items-center justify-center ml-auto" style="background:var(--accent);color:var(--accent-foreground)">${l.unread}</span>`:''}
          </div>
        </div>
      </div>
    </div>`;
  }).join("") || `<div class="p-6 text-center text-sm" style="color:var(--text-tertiary)">No leads match this filter.</div>`;
}

function selectLead(id){
  activeId = id;
  renderList();
  renderChat();
  renderIntel();
  if(window.innerWidth<=860){
    document.getElementById("convPanel").classList.remove("open");
    document.getElementById("backdrop").classList.remove("open");
  }
}

function togglePanel(panelId){
  const panel = document.getElementById(panelId);
  const isOpening = !panel.classList.contains("open");
  document.getElementById("convPanel").classList.remove("open");
  document.getElementById("intelPanel").classList.remove("open");
  if(isOpening) panel.classList.add("open");
  document.getElementById("backdrop").classList.toggle("open", isOpening);
}
function closePanels(){
  document.getElementById("convPanel").classList.remove("open");
  document.getElementById("intelPanel").classList.remove("open");
  document.getElementById("backdrop").classList.remove("open");
}

function renderChat(){
  const l = LEADS.find(x=>x.id===activeId);
  const st = STAGE_STYLE[l.stage];

  document.getElementById("chatHeader").innerHTML = `
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-full flex items-center justify-center text-xs font-semibold" style="background:var(--bg-quaternary);color:var(--text-secondary)">${initials(l.name)}</div>
      <div>
        <div class="text-sm font-medium flex items-center gap-2" style="color:var(--text-primary)">
          ${l.name}
          <span class="text-[10px] font-medium px-1.5 py-0.5 rounded" style="background:${st.bg};color:${st.text};border:1px solid ${st.border}">${l.stage}</span>
        </div>
        <div class="text-xs" style="color:var(--text-tertiary)">${l.phone} · ${l.location}</div>
      </div>
    </div>
    <div class="flex items-center gap-1">
      <div class="rail-btn" style="width:32px;height:32px" onclick="logCall()" title="Log call">${icon('phone','icon icon-sm')}</div>
      <div class="rail-btn" style="width:32px;height:32px">${icon('more','icon icon-sm')}</div>
      <div class="toggle-btn toggle-intel rail-btn" style="width:32px;height:32px" onclick="togglePanel('intelPanel')" title="Lead details">${icon('target','icon icon-sm')}</div>
    </div>`;

  document.getElementById("messages").innerHTML = `
    <div class="text-center text-[11px] mb-1" style="color:var(--text-tertiary)">Today</div>
    ` + l.messages.map(m=>`
    <div class="flex ${m.from==='rep'?'justify-end':'justify-start'} fade-in">
      <div class="max-w-[70%] px-3.5 py-2.5 text-sm ${m.from==='rep'?'bubble-out':'bubble-in'}" style="color:var(--text-primary)">
        <div>${m.text}</div>
        <div class="flex items-center gap-1 justify-end mt-1">
          <span class="text-[10px]" style="color:var(--text-tertiary)">${m.time}</span>
          ${m.from==='rep'?icon('checkCheck','icon-sm'):''}
        </div>
      </div>
    </div>`).join("");
  document.getElementById("messages").scrollTop = document.getElementById("messages").scrollHeight;

  const quickReplies = ["Send Pricing","Send Portfolio","Schedule Site Visit","Send Quote","Request Photos"];
  document.getElementById("quickReplies").innerHTML = quickReplies.map(q=>`
    <div class="qr-chip text-xs px-3 py-1.5 rounded-full border border-[var(--border)]" style="color:var(--text-secondary)" onclick="sendQuick('${q}')">${q}</div>
  `).join("");
}

function sendQuick(label){
  const l = LEADS.find(x=>x.id===activeId);
  const textMap = {
    "Send Pricing":"Sure — here's our current pricing pack for that system. [Pricing PDF attached]",
    "Send Portfolio":"Here's a link to recent installs in your area so you can see the finish quality. [Portfolio link]",
    "Schedule Site Visit":"I can get a technician out for a free site visit — what day works for you this week?",
    "Send Quote":"Attaching the formal quote now — let me know if you'd like any adjustments. [Quote PDF attached]",
    "Request Photos":"Could you send a couple of photos of your roof/meter board so we can size the system accurately?"
  };
  l.messages.push({from:"rep", time:"Just now", text: textMap[label]});
  renderChat();
}

function logCall(){
  const l = LEADS.find(x=>x.id===activeId);
  l.messages.push({from:"rep", time:"Just now", text:"📞 Call logged — Outcome: Reached. Notes added to lead timeline."});
  renderChat();
}

document.getElementById("sendBtn").addEventListener("click", ()=>{
  const input = document.getElementById("msgInput");
  if(!input.value.trim()) return;
  const l = LEADS.find(x=>x.id===activeId);
  l.messages.push({from:"rep", time:"Just now", text: input.value.trim()});
  input.value = "";
  renderChat();
});
document.getElementById("msgInput").addEventListener("keydown", (e)=>{
  if(e.key==="Enter") document.getElementById("sendBtn").click();
});

function barRow(label, value, max, ic){
  const pct = Math.round((value/max)*100);
  return `
  <div>
    <div class="flex items-center justify-between mb-1">
      <div class="flex items-center gap-1.5 text-xs" style="color:var(--text-secondary)">${icon(ic,'icon-sm')} ${label}</div>
      <span class="text-xs font-medium serif" style="color:var(--text-primary)">${value}/${max}</span>
    </div>
    <div class="h-1.5 rounded-full w-full" style="background:var(--bg-quaternary)">
      <div class="score-bar-fill h-1.5 rounded-full" style="width:${pct}%;background:var(--accent)"></div>
    </div>
  </div>`;
}

function renderIntel(){
  const l = LEADS.find(x=>x.id===activeId);
  const color = scoreColor(l.score);
  const label = scoreLabel(l.score);

  document.getElementById("intelPanel").innerHTML = `
  <div class="p-5 flex flex-col gap-5">

    <div class="rounded-xl border border-[var(--border)] bg-[var(--surface-card)] p-5 text-center">
      <div class="text-xs uppercase tracking-wide mb-2" style="color:var(--text-tertiary)">Lead Intent Score</div>
      <div class="serif text-5xl font-normal" style="color:${color}">${l.score}</div>
      <div class="text-xs font-medium mt-1 px-2 py-0.5 rounded-full inline-block" style="background:${color}22;color:${color}">${label} Lead</div>
      ${l.hotSLA ? `<div class="flex items-center justify-center gap-1.5 mt-3 text-xs" style="color:var(--error)"><span class="w-1.5 h-1.5 rounded-full pulse-dot" style="background:var(--error)"></span>5-min SLA active</div>` : ''}
    </div>

    <div class="rounded-xl border border-[var(--border)] bg-[var(--surface-card)] p-5 flex flex-col gap-3">
      <div class="text-xs font-semibold uppercase tracking-wide" style="color:var(--text-tertiary)">Score Breakdown</div>
      ${barRow("Urgency", l.breakdown.urgency, 25, "zap")}
      ${barRow("Budget", l.breakdown.budget, 25, "dollar")}
      ${barRow("Location", l.breakdown.location, 15, "mapPin")}
      ${barRow("Product Interest", l.breakdown.productInterest, 20, "target")}
      ${barRow("Engagement", l.breakdown.engagement, 15, "activity")}
    </div>

    <div class="rounded-xl border border-[var(--border)] bg-[var(--surface-card)] p-5">
      <div class="flex items-center gap-1.5 text-xs font-semibold uppercase tracking-wide mb-2" style="color:var(--text-tertiary)">${icon('sparkle','icon-sm')} AI Qualification</div>
      <p class="text-sm leading-relaxed" style="color:var(--text-secondary)">${l.ai}</p>
    </div>

    <div class="rounded-xl p-5" style="background:rgba(212,255,79,0.08);border:1px solid rgba(212,255,79,0.25)">
      <div class="text-xs font-semibold uppercase tracking-wide mb-2" style="color:var(--accent)">Suggested Next Action</div>
      <p class="text-sm mb-3" style="color:var(--text-primary)">${l.nextAction}</p>
      <button class="w-full py-2 rounded-lg text-sm font-medium" style="background:var(--accent);color:var(--accent-foreground)">Mark Action Complete</button>
    </div>

    <div class="rounded-xl border border-[var(--border)] bg-[var(--surface-card)] p-5 flex flex-col gap-3">
      <div class="text-xs font-semibold uppercase tracking-wide" style="color:var(--text-tertiary)">Assignment</div>
      <div class="flex items-center justify-between">
        <span class="text-sm" style="color:var(--text-primary)">${l.assigned ? l.assigned : 'Unassigned'}</span>
        <div class="flex items-center gap-1 text-xs cursor-pointer" style="color:var(--text-tertiary)">Reassign ${icon('chevronDown','icon-sm')}</div>
      </div>
      <button class="w-full py-2 rounded-lg text-sm font-medium border border-[var(--border)] flex items-center justify-center gap-1.5" style="color:var(--text-secondary)">${icon('clock','icon-sm')} Schedule Follow-up</button>
    </div>

    <div class="rounded-xl border border-[var(--border)] bg-[var(--surface-card)] p-5 flex flex-col gap-3">
      <div class="text-xs font-semibold uppercase tracking-wide" style="color:var(--text-tertiary)">Contact Details</div>
      <div class="flex items-center gap-2 text-sm" style="color:var(--text-secondary)">${icon('phone','icon-sm')} ${l.phone}</div>
      <div class="flex items-center gap-2 text-sm" style="color:var(--text-secondary)">${icon('mapPin','icon-sm')} ${l.location}</div>
      <div class="flex items-center gap-2 text-sm" style="color:var(--text-secondary)">${icon('target','icon-sm')} ${l.product}</div>
      <div class="flex items-center gap-2 text-sm" style="color:var(--text-secondary)">Source: ${l.source}</div>
    </div>

    <div class="flex flex-wrap gap-1.5">
      ${l.tags.map(t=>`<span class="text-[11px] px-2 py-1 rounded-full flex items-center gap-1" style="background:var(--bg-quaternary);color:var(--text-secondary)">${icon('tag','icon-sm')} ${t}</span>`).join("")}
    </div>

  </div>`;
}

document.getElementById("filterTabs").addEventListener("click",(e)=>{
  const tab = e.target.closest(".filter-tab");
  if(!tab) return;
  document.querySelectorAll(".filter-tab").forEach(t=>t.classList.remove("active"));
  tab.classList.add("active");
  activeFilter = tab.dataset.filter;
  renderList();
});

document.getElementById("searchInput").addEventListener("input",(e)=>{
  searchTerm = e.target.value.toLowerCase();
  renderList();
});

renderList();
renderChat();
renderIntel();
</script>
